[project]
name = "harmony-analyzer"
version = "0.1.0"
description = "Chord progression, voicing and inversion analyzer for songs"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.3",
    "scipy>=1.11",
    "numba==0.61.2",
    "librosa<0.12",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13",
    "music21>=9",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = ["pytest>=8"]

[project.scripts]
harmony = "harmony.cli:main"
harmony-web = "harmony.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "harmony/schemas"
